          const control = select.closest(".assignee-control");
          const label = control && control.querySelector("label");
          if (control) control.classList.toggle("is-saving", Boolean(asset.isAssigning));
          if (label) label.textContent = asset.isAssigning ? "正在保存领取人" : asset.assignee ? `已领取：${asset.assignee}` : "领取人";
          if (select.value !== (asset.assignee || "")) select.value = asset.assignee || "";
          select.disabled = Boolean(asset.isAssigning || asset.assignee || !assignees.length);
        });

        if (!els.lightbox.classList.contains("is-visible")) return;
        if (els.lightboxDownload.dataset.download !== asset.id) return;
        els.lightboxAssignee.innerHTML = assigneeControlHtml(asset, "lightbox") || escapeHtml(asset.assignee || "无");
      }

      function syncAssetViews(asset) {
        if (state.statView === "favorites") {
          renderGallery();
        } else {
          syncAssetInlineViews(asset);
        }
        if (!asset || !els.lightbox.classList.contains("is-visible")) return;
        if (els.lightboxDownload.dataset.download !== asset.id) return;

        els.lightboxStats.textContent = `下载 ${getDownloadCount(asset)} · 收藏 ${getFavoriteCount(asset)}`;
        els.lightboxAssignee.innerHTML = assigneeControlHtml(asset, "lightbox") || escapeHtml(asset.assignee || "无");
        const href = getAssetDownloadHref(asset);
        els.lightboxDownload.href = href || "#";
      }

      function syncNavState() {
        const currentGroup = getCurrentGroup();
        const currentType = getCurrentType();
        document.querySelectorAll(".nav-group").forEach((item) => {
          const parent = item.querySelector(".nav-parent");
          item.classList.toggle("is-expanded", Boolean(currentGroup && parent && parent.dataset.group === currentGroup));
        });
        document.querySelectorAll(".nav-parent").forEach((button) => {
          const isActive = button.dataset.group === currentGroup && !currentType;
          button.classList.toggle("is-active", isActive);
        });
        document.querySelectorAll(".nav-child").forEach((button) => {
          const isActive = button.dataset.group === currentGroup && button.dataset.type === currentType;
          button.classList.toggle("is-active", isActive);
        });
      }

      async function downloadAsset(assetId, options = {}) {
        const asset = getAssetById(assetId);
        if (!asset) return;
        const url = getAssetDownloadHref(asset);
        if (!url) throw new Error("此素材没有可下载的文件链接");
        if (!options.nativeOpen) {
          const drive = Boolean(toDriveDownloadUrl(url));
          let href = url;
          if (!drive) {
            // Cross-origin `download` is ignored by browsers. For ordinary direct
            // file hosts, use a browser-local Blob; never proxy through Cloudflare.
            let response;
            try { response = await fetch(url, {credentials:"omit", referrerPolicy:"no-referrer"}); }
            catch { throw new Error("文件来源不允许网页下载，请在素材预览中打开原文件后下载"); }
            if (!response.ok || /text\/html/i.test(response.headers.get("Content-Type") || "")) throw new Error("来源返回了查看页面，无法直接下载，请打开原文件检查下载权限");
            href = URL.createObjectURL(await response.blob());
          }
          const link = document.createElement("a");
          let filename = asset.title || "素材";
          if (!drive && !/\.[a-z0-9]{2,5}$/i.test(filename)) {
            const extension = new URL(url).pathname.match(/\.(png|jpe?g|gif|webp|mp4|mov|webm|pdf)$/i);
            if (extension) filename += '.' + extension[1];
          }
          link.href = href; link.download = drive ? "" : filename.replace(/[\\/:*?"<>|]/g, '_');
          link.target = drive ? "assetDownloadFrame" : "_self";
          link.referrerPolicy = "no-referrer";
          document.body.appendChild(link); link.click(); link.remove();
          if (!drive) setTimeout(() => URL.revokeObjectURL(href), 60000);
        }
        asset.downloads = Number(asset.downloads || 0) + 1;
        syncAssetViews(asset);
      }

      async function toggleFavorite(assetId) {
        const asset = getAssetById(assetId);
        if (!asset) return;
        if (state.favorites.has(assetId)) state.favorites.delete(assetId);
        else state.favorites.add(assetId);
        asset.favorites = state.favorites.has(assetId) ? 1 : 0;
        saveState();
        syncAssetViews(asset);
      }

      async function assignAsset(assetId, assignee) {
        const token = getToken();
        if (!token) {
          showLogin();
          return;
        }
        const asset = getAssetById(assetId);
        if (!asset || !isAssignableAsset(asset)) return;
        if (asset.assignee && assignee !== asset.assignee) {
          showError(new Error(`这个素材已被 ${asset.assignee} 领取，不能修改`));
          syncAssigneeViews(asset);
          return;
        }

        const previousAssignee = asset.assignee || "";
        const previousAssignedAt = asset.assignedAt || "";
        asset.assignee = assignee || "";
        asset.assignedAt = assignee ? new Date().toISOString() : "";
        asset.isAssigning = Boolean(assignee);
        if (assignee) els.resultText.textContent = `正在保存领取人：${assignee}`;
        syncAssigneeViews(asset);

        try {
          const data = await apiPost({ action: "assign", token, id: assetId, assignee: assignee || "" });
          if (data.assignees) assignees = normalizeAssignees(data.assignees);
          asset.assignee = data.assignee || "";
          asset.assignedAt = data.assignedAt || "";
          asset.isAssigning = false;
          if (data.favorites !== undefined) asset.favorites = Number(data.favorites || 0);
          if (data.downloads !== undefined) asset.downloads = Number(data.downloads || 0);
          saveBrowserAssetCache().catch((error) => console.warn(error));
          if (asset.assignee) els.resultText.textContent = `领取人已保存：${asset.assignee}`;
          syncAssetInlineViews(asset);
        } catch (error) {
          asset.assignee = previousAssignee;
          asset.assignedAt = previousAssignedAt;
          asset.isAssigning = false;
          syncAssigneeViews(asset);
          showError(error);
        }
      }

      function formatRefreshStatus(status) {
        if (!status || !status.state) return "刷新状态未知";
        if (status.state === "queued") return "刷新任务已提交，后台即将开始";
        if (status.state === "running") {
          const total = Number(status.total || 0);
          const processedRows = Number(status.processedRows || 0);
          const cursorText = formatRefreshCursors(status.catalogCursors);
          const parts = ["后台刷新中，当前仍显示旧缓存"];
          if (total) parts.push(`已生成 ${total} 个素材`);
          if (processedRows) parts.push(`已扫描 ${processedRows} 行`);
          if (cursorText) parts.push(cursorText);
          return parts.join(" · ");
        }
        if (status.state === "completed") {
          const total = Number(status.total || 0);
          return total ? `缓存已刷新 · ${total} 个素材` : "缓存已刷新";
        }
        if (status.state === "failed") return status.error || "刷新失败";
        return status.message || "暂无刷新任务";
      }

      function formatRefreshCursors(cursors) {
        if (!Array.isArray(cursors) || !cursors.length) return "";
        return cursors
          .map((cursor) => {
            const title = cursor.title || cursor.id || "目录";
            const lastRow = Number(cursor.lastRow || 0);
            const scanned = Math.max(0, Math.min(lastRow || Number(cursor.nextRow || 1), Number(cursor.nextRow || 1) - 1));
            const assetsCount = Number(cursor.assetCount || 0);
            const rowText = lastRow ? `${scanned}/${lastRow}` : String(scanned);
            return `${title} ${rowText} 行/${assetsCount} 个`;
          })
          .join(" · ");
      }

      function refreshStatusLabel(status) {
        if (!status || !status.state) return "未知";
        if (status.state === "queued") return "等待中";
        if (status.state === "running") return "运行中";
        if (status.state === "completed") return "已完成";
        if (status.state === "failed") return "失败";
        return status.message || status.state;
      }

      function formatRefreshCursorCards(cursors) {
        if (!Array.isArray(cursors) || !cursors.length) return "";
        return cursors
          .map((cursor) => {
            const title = cursor.title || cursor.id || "目录";
            const catalogId = cursor.id || "";
            const lastRow = Number(cursor.lastRow || 0);
            const scanned = Math.max(0, Math.min(lastRow || Number(cursor.nextRow || 1), Number(cursor.nextRow || 1) - 1));
            const assetsCount = Number(cursor.assetCount || 0);
            const visibleCount = getVisibleAssets().filter((asset) => asset.catalogId === catalogId).length;
            const rowText = lastRow ? `${formatNumber(scanned)}/${formatNumber(lastRow)}` : formatNumber(scanned);
            return `
              <span class="refresh-log-chip is-group" title="${escapeHtml(title)}：已扫描 ${rowText} 行，已更新 ${formatNumber(assetsCount)} 个，当前显示 ${formatNumber(visibleCount)} 个">
                <span class="refresh-log-v">${escapeHtml(title)}</span>
                <span class="refresh-log-k">扫</span><span class="refresh-log-v">${rowText}</span>
                <span class="refresh-log-k">更</span><span class="refresh-log-v">${formatNumber(assetsCount)}</span>
                <span class="refresh-log-k">显</span><span class="refresh-log-v">${formatNumber(visibleCount)}</span>
              </span>
            `;
          })
          .join("");
      }

      function renderRefreshLog(status, details = {}) {
        if (!status || !status.state) return;

        const processedRows = Number(status.processedRows || 0);
        const generatedAssets = Number(status.total || 0);
        const merged = Number(details.merged || 0);
        const visibleCount = getVisibleAssets().length;
        const stateTitle = `状态：${refreshStatusLabel(status)}，已扫描 ${formatNumber(processedRows)} 行，本轮更新 ${formatNumber(generatedAssets)} 个，当前显示 ${formatNumber(visibleCount)} 个`;

        els.refreshLog.hidden = false;
        els.refreshLog.innerHTML = `
          <div class="refresh-log-strip">
            <span class="refresh-log-chip is-state" title="${escapeHtml(stateTitle)}">
              <span class="refresh-log-v">${escapeHtml(refreshStatusLabel(status))}</span>
              <span class="refresh-log-k">扫</span><span class="refresh-log-v">${formatNumber(processedRows)}</span>
              <span class="refresh-log-k">更</span><span class="refresh-log-v">${formatNumber(generatedAssets)}</span>
              <span class="refresh-log-k">显</span><span class="refresh-log-v">${formatNumber(visibleCount)}</span>
              ${merged ? `<span class="refresh-log-k">+</span><span class="refresh-log-v">${formatNumber(merged)}</span>` : ""}
            </span>
            ${formatRefreshCursorCards(status.catalogCursors)}
          </div>
        `;
      }

      async function pollRefreshStatus(times = 24) {
        if (times <= 0) {
          els.refreshDataBtn.disabled = false;
          return;
        }

        const token = getToken();
        if (!token) {
          els.refreshDataBtn.disabled = false;
          return;
        }

        const data = await apiPost({ action: "refreshStatus", token });
        const status = data.status || {};
        els.resultText.textContent = formatRefreshStatus(status);
        if (status.state === "completed") {
          assetsLoadPromise = null;
          els.refreshDataBtn.disabled = false;
          pendingMergeState = { buildId: "", loaded: 0 };
          renderRefreshLog(status);
          loadAssetsPages({ force: true, background: isHomeMode() }).catch(showError);
          return;
        }

        if (status.state === "running") {
          renderRefreshLog(status);
        }

        if (status.state === "failed") {
          els.refreshDataBtn.disabled = false;
          renderRefreshLog(status);
          return;
        }

        setTimeout(() => pollRefreshStatus(times - 1).catch(showError), 5000);
      }

      async function refreshData() {
        els.refreshDataBtn.disabled = true;
        try {
          if (assetsLoading) return;
          resetLoadedGallery(); await clearBrowserAssetCache();
          await loadAssetsPages({force:true, background:false});
        }
        finally { els.refreshDataBtn.disabled = false; }
      }

      function openLightbox(assetId) {
        const asset = getAssetById(assetId);
        if (!asset) return;
        const frame = document.getElementById("lightboxVideo");
        const player = document.getElementById("lightboxDirectVideo");
        const video = asset.mediaType === "video";
        const drive = video && getAssetFileId(asset) && /(?:drive|docs)\.google\.com/.test(asset.viewUrl);
        frame.removeAttribute("src"); player.pause(); player.removeAttribute("src");
        frame.hidden = !drive; player.hidden = !video || Boolean(drive); els.lightboxImg.hidden = video;
        if (drive) frame.src = `https://drive.google.com/file/d/${encodeURIComponent(getAssetFileId(asset))}/preview`;
        else if (video && isExternalUrl(asset.videoUrl)) player.src = asset.videoUrl;
        else {
          els.lightboxImg.dataset.assetImg = asset.id;
          els.lightboxImg.dataset.previewIndex = "0";
          els.lightboxImg.src = getAssetImageSrc(asset);
          els.lightboxImg.alt = asset.title;
        }
        els.lightboxTitle.textContent = asset.title;
        els.lightboxDate.textContent = asset.date;
        els.lightboxGroup.textContent = asset.group;
        els.lightboxType.textContent = asset.type;
        els.lightboxMaker.textContent = asset.maker;
        els.lightboxAssignee.textContent = "";
        els.lightboxStats.textContent = video ? "视频预览" : "图片预览";
        els.lightboxDownload.href = getAssetDownloadHref(asset) || "#";
        els.lightboxOriginal.href = asset.viewUrl || "#";
        els.lightboxDownload.dataset.download = asset.id;
        els.lightbox.classList.add("is-visible");
        document.body.classList.add("is-locked");
      }

      function closeLightbox() {
        els.lightbox.classList.remove("is-visible");
        document.body.classList.remove("is-locked");
        els.lightboxImg.removeAttribute("src");
        delete els.lightboxImg.dataset.assetImg;
        document.getElementById("lightboxVideo").removeAttribute("src");
        const player = document.getElementById("lightboxDirectVideo");
        player.pause(); player.removeAttribute("src"); player.load();
      }

      function showLogin() {
        els.loginGate.classList.add("is-visible");
        document.body.classList.add("is-locked");
        setTimeout(() => els.passwordInput.focus(), 50);
      }

      function hideLogin() {
        els.loginGate.classList.remove("is-visible");
        document.body.classList.remove("is-locked");
      }

      function bindEvents() {
        els.homeView.addEventListener("error", handleImageError, true);
        els.homeView.addEventListener("load", handleImageLoad, true);
        els.gallery.addEventListener("error", handleImageError, true);
        els.gallery.addEventListener("load", handleImageLoad, true);
        els.lightboxImg.addEventListener("error", handleImageError);
        els.lightboxImg.addEventListener("load", handleImageLoad);

        els.homeView.addEventListener("click", (event) => {
          const card = event.target.closest("[data-home-group]");
          if (!card) return;
          state.activeGroup = card.dataset.homeGroup;
          state.activeType = "";
          state.group = "";
          state.type = "";
          els.groupSelect.value = "";
          els.typeSelect.value = "";
          renderGallery();
        });

        els.subcategoryView.addEventListener("click", (event) => {
          const card = event.target.closest("[data-subcategory]");
          if (!card) return;
          state.activeGroup = card.dataset.group;
          state.activeType = card.dataset.subcategory;
          state.group = "";
          state.type = "";
          els.groupSelect.value = "";
          els.typeSelect.value = "";
          renderGallery();
        });

        els.navList.addEventListener("click", (event) => {
          const child = event.target.closest(".nav-child");
          const parent = event.target.closest(".nav-parent");
          if (child) {
            state.activeGroup = child.dataset.group;
            state.activeType = child.dataset.type;
            state.group = "";
            state.type = "";
            els.groupSelect.value = "";
            els.typeSelect.value = "";
            renderGallery();
            return;
          }
          if (parent) {
            const sameGroup = getCurrentGroup() === parent.dataset.group && !getCurrentType();
            state.activeGroup = sameGroup ? "" : parent.dataset.group;
            state.activeType = "";
            state.group = "";
            state.type = "";
            els.groupSelect.value = "";
            els.typeSelect.value = "";
            renderGallery();
          }
        });

        els.gallery.addEventListener("click", (event) => {
          const favoriteButton = event.target.closest("[data-favorite]");
          const downloadButton = event.target.closest("[data-download]");
          const openButton = event.target.closest("[data-open]");
          if (favoriteButton) {
            toggleFavorite(favoriteButton.dataset.favorite).catch(showError);
            return;
          }
          if (downloadButton) {
            const href = downloadButton.getAttribute("href") || "";
            if (!href || href === "#" || !toDriveDownloadUrl(href)) {
              event.preventDefault();
              downloadAsset(downloadButton.dataset.download).catch(showError);
            } else {
              setTimeout(() => {
                downloadAsset(downloadButton.dataset.download, { nativeOpen: true }).catch(showError);
              }, 0);
            }
            return;
          }
          if (openButton) {
            const assetId = openButton.dataset.open;
            const asset = getAssetById(assetId);
            if (previewBlockedIds.has(assetId) && asset?.mediaType !== "video") {
              if (asset && isExternalUrl(asset.viewUrl)) window.open(asset.viewUrl, "_blank", "noopener");
              return;
            }
            openLightbox(assetId);
          }
        });

        els.gallery.addEventListener("change", (event) => {
          const select = event.target.closest("[data-assignee]");
          if (!select) return;
          assignAsset(select.dataset.assignee, select.value).catch(showError);
        });

        els.lightbox.addEventListener("change", (event) => {
          const select = event.target.closest("[data-assignee]");
          if (!select) return;
          assignAsset(select.dataset.assignee, select.value).catch(showError);
        });

        els.lightboxDownload.addEventListener("click", (event) => {
          const assetId = event.currentTarget.dataset.download;
          if (assetId) {
            const href = event.currentTarget.getAttribute("href") || "";
            if (!href || href === "#" || !toDriveDownloadUrl(href)) {
              event.preventDefault();
              downloadAsset(assetId).catch(showError);
            } else {
              setTimeout(() => {
                downloadAsset(assetId, { nativeOpen: true }).catch(showError);
              }, 0);
            }
          }
        });

        els.favoriteSummary.addEventListener("click", () => {
          toggleStatView("favorites");
        });

        els.downloadSummary.addEventListener("click", () => {
          toggleStatView("downloads");
        });

        els.searchInput.addEventListener("input", (event) => {
          state.query = event.target.value;
          renderGallery();
        });

        els.startDateInput.addEventListener("change", (event) => {
          state.startDate = event.target.value;
          state.datePreset = "";
          syncRangeSelect();
          renderGallery();
        });

        els.endDateInput.addEventListener("change", (event) => {
          state.endDate = event.target.value;
          state.datePreset = "";
          syncRangeSelect();
          renderGallery();
        });

        els.quickRangeSelect.addEventListener("change", (event) => {
          const preset = event.target.value;
          const today = new Date();
          if (!preset) {
            state.datePreset = "";
            renderGallery();
            return;
          }
          if (preset === "today") {
            const date = formatDate(today);
            setDateRange(date, date, "today");
            return;
          }
          if (preset === "yesterday") {
            const date = formatDate(addDays(today, -1));
            setDateRange(date, date, "yesterday");
            return;
          }
          if (preset === "last7") {
            setDateRange(formatDate(addDays(today, -6)), formatDate(today), "last7");
          }
        });

        els.groupSelect.addEventListener("change", (event) => {
          state.group = event.target.value;
          state.activeGroup = "";
          if (state.group) state.activeType = "";
          renderGallery();
        });

        els.typeSelect.addEventListener("change", (event) => {
          state.type = event.target.value;
          state.activeType = "";
          if (state.type) {
            const matched = getVisibleAssets().find((asset) => asset.type === state.type);
            state.group = matched ? matched.group : state.group;
            els.groupSelect.value = state.group;
          }
          renderGallery();
        });

        els.makerSelect.addEventListener("change", (event) => {
          state.maker = event.target.value;
          renderGallery();
        });

        els.assigneeStatusSelect.addEventListener("change", (event) => {
          state.assigneeStatus = event.target.value;
          renderGallery();
        });

        els.dateSortSelect.addEventListener("change", (event) => {
          state.dateSort = event.target.value;
          renderGallery();
        });

        els.resetBtn.addEventListener("click", () => {
          state.group = "";
          state.type = "";
          state.maker = "";
          state.assigneeStatus = "";
          state.startDate = "";
          state.endDate = "";
          state.datePreset = "";
          state.dateSort = "";
          state.query = "";
          state.activeGroup = "";
          state.activeType = "";
          state.statView = "";
          els.searchInput.value = "";
          els.startDateInput.value = "";
          els.endDateInput.value = "";
          els.groupSelect.value = "";
          els.typeSelect.value = "";
          els.makerSelect.value = "";
          els.assigneeStatusSelect.value = "";
          els.dateSortSelect.value = "";
          syncRangeSelect();
          renderGallery();
        });

        els.viewButtons.forEach((button) => {
          button.addEventListener("click", () => {
            const view = button.dataset.view;
            els.gallery.classList.toggle("is-grid", view === "grid");
            els.viewButtons.forEach((item) => item.classList.toggle("is-active", item === button));
          });
        });
        document.addEventListener("visibilitychange", checkVisibleCache);

        els.loginForm.addEventListener("submit", async (event) => {
          event.preventDefault();
          els.loginError.textContent = "";
          try {
            await login(els.passwordInput.value);
            els.passwordInput.value = "";
            hideLogin();
            await loadRemoteData();
          } catch (error) {
            els.loginError.textContent = error.message || "登录失败";
          }
        });

        els.logoutBtn.addEventListener("click", async () => {
          if (cachePollTimer) {
            clearInterval(cachePollTimer);
            cachePollTimer = null;
          }
          closeLightbox();
          await invalidateLogin();
        });

        els.refreshDataBtn.addEventListener("click", () => {
          refreshData().catch((error) => {
            els.refreshDataBtn.disabled = false;
            showError(error);
          });
        });

        els.closeLightbox.addEventListener("click", closeLightbox);
        els.lightbox.addEventListener("click", (event) => {
          if (event.target === els.lightbox) closeLightbox();
        });
        window.addEventListener("keydown", (event) => {
          if (event.key === "Escape") closeLightbox();
        });
      }

      function showError(error) {
        const message = error && error.message ? error.message : String(error);
        if (/未登录|登录/.test(message)) showLogin();
        else alert(message);
      }

      async function init() {
        loadState();
        bindEvents();
        if (!getToken()) {
          try { await login(""); }
          catch { showLogin(); return; }
        }
        hideLogin();
        try {
          await loadRemoteData();
        } catch (error) {
          const message = error && error.message ? error.message : String(error);
          if (/未登录|登录|过期|失效|密码/.test(message)) {
            sessionStorage.removeItem(TOKEN_KEY);
            showLogin();
            els.loginError.textContent = message || "登录已失效";
          } else {
            els.resultText.textContent = "目录载入失败";
            els.emptyState.textContent = message;
            els.emptyState.classList.add("is-visible");
            console.error(error);
          }
        }
      }

      init();
    </script>
  </body>
</html>
