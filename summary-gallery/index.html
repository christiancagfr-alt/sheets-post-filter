<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <title>素材成品库</title>
    <style>
      :root {
        --bg: #f2f6fc;
        --surface: #ffffff;
        --surface-2: #e8effa;
        --text: #23324a;
        --muted: #6b7c94;
        --line: #dbe4f0;
        --ink: #2448a6;
        --teal: #3478df;
        --teal-2: #e5efff;
        --rose: #c2415d;
        --gold: #b57913;
        --shadow: 0 16px 44px rgba(25, 30, 24, 0.12);
        --sidebar: 204px;
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        letter-spacing: 0;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .app-shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: var(--sidebar) minmax(0, 1fr);
      }

      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        overflow: auto;
        padding: 16px 10px;
        background: linear-gradient(160deg, #f9fbff, #edf3fc);
        border-right: 1px solid var(--line);
      }

      .brand {
        display: grid;
        grid-template-columns: 32px 1fr;
        gap: 9px;
        align-items: center;
        margin-bottom: 16px;
      }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: linear-gradient(135deg, #477dec, #2448a6);
        color: #fff;
        font-weight: 800;
        font-size: 20px;
      }

      .brand-title {
        margin: 0;
        font-size: 16px;
        line-height: 1.2;
      }

      .brand-meta {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      .sidebar-section {
        margin: 12px 0 6px;
      }

      .nav-label {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 750;
      }

      .nav-list,
      .sub-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .sub-list {
        display: none;
      }

      .nav-group.is-expanded .sub-list {
        display: block;
      }

      .nav-group {
        margin-bottom: 6px;
      }

      .nav-parent,
      .nav-child {
        width: 100%;
        border: 0;
        background: transparent;
        color: inherit;
        text-align: left;
        display: flex;
        align-items: center;
        gap: 9px;
        border-radius: 8px;
      }

      .nav-parent {
        min-height: 32px;
        padding: 6px 8px;
        font-size: 14px;
        font-weight: 760;
        justify-content: space-between;
      }

      .nav-parent.is-active {
        background: var(--ink);
        color: #fff;
      }

      .nav-parent-main {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        min-width: 0;
      }

      .nav-chevron {
        color: currentColor;
        font-size: 18px;
        line-height: 1;
        opacity: 0.62;
        transition: transform 160ms ease;
      }

      .nav-group.is-expanded .nav-chevron {
        transform: rotate(90deg);
      }

      .nav-child {
        min-height: 28px;
        padding: 5px 7px 5px 20px;
        color: #52647e;
        font-size: 12px;
      }

      .nav-child.is-active,
      .nav-child:hover,
      .nav-parent:hover {
        background: var(--surface-2);
        color: var(--ink);
      }

      .nav-parent.is-active:hover {
        background: var(--ink);
        color: #fff;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 99px;
        background: var(--teal);
        flex: 0 0 auto;
      }

      .nav-group:nth-child(2) .dot {
        background: var(--rose);
      }

      .nav-group:nth-child(3) .dot {
        background: var(--gold);
      }

      .main {
        min-width: 0;
        padding: 14px 18px 32px;
      }

      .toolbar {
        position: sticky;
        top: 0;
        z-index: 20;
        margin: -14px -18px 10px;
        padding: 11px 18px 10px;
        background: rgba(246, 249, 255, 0.96);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(18px);
      }

      .toolbar-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 9px;
      }

      .toolbar-title-block {
        min-width: 0;
        flex: 1;
      }

      .page-title {
        margin: 0;
        font-size: 20px;
        line-height: 1.12;
      }

      .page-subtitle {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .toolbar-actions {
        display: flex;
        align-items: center;
        gap: 7px;
      }

      .pill-stat {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 32px;
        padding: 5px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface);
        color: #415a7c;
        font-size: 13px;
        cursor: pointer;
        transition:
          background 150ms ease,
          border-color 150ms ease,
          color 150ms ease,
          transform 150ms ease;
      }

      .pill-stat:hover {
        transform: translateY(-1px);
        border-color: rgba(15, 118, 110, 0.36);
      }

      .pill-stat.is-active {
        background: var(--ink);
        border-color: var(--ink);
        color: #fff;
      }

      .icon-btn,
      .login-btn {
        display: inline-grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--text);
      }

      .icon-btn:hover,
      .login-btn:hover {
        border-color: #a8b3a3;
        box-shadow: 0 8px 18px rgba(25, 30, 24, 0.08);
      }

      .icon-btn:disabled,
      .login-btn:disabled {
        cursor: progress;
        opacity: 0.55;
      }

      .icon-btn svg,
      .login-btn svg,
      .card-action svg,
      .download-link svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .filter-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: end;
      }

      .field {
        display: grid;
        gap: 3px;
        min-width: 0;
      }

      .filter-grid > .field { flex: 1 1 110px; }
      .filter-grid > .field:has(input[type="date"]) { flex-basis: 132px; }
      .toolbar-search { width: clamp(200px, 22vw, 320px); }
      .toolbar-search label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

      .field.is-wide {
        grid-column: span 2;
      }

      .field label {
        color: #657891;
        font-size: 11px;
        font-weight: 680;
      }

      .field input,
      .field select {
        width: 100%;
        min-height: 32px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--text);
        padding: 5px 8px;
        font-size: 12px;
        outline: none;
      }

      .field input:focus,
      .field select:focus {
        border-color: var(--teal);
        box-shadow: 0 0 0 3px rgba(52, 120, 223, 0.12);
      }

      .reset-btn {
        min-height: 32px;
        border: 1px solid var(--ink);
        border-radius: 8px;
        background: var(--ink);
        color: #fff;
        padding: 5px 12px;
        font-size: 12px;
        font-weight: 760;
      }

      .reset-btn:hover {
        background: #1c3c93;
      }

      .collection-status {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
      }

      .active-path {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        min-width: 0;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 5px 9px;
        border: 1px solid #cfd8ca;
        border-radius: 999px;
        background: #fff;
        color: #465044;
        font-size: 12px;
        font-weight: 660;
      }

      .chip.strong {
        background: var(--teal-2);
        border-color: #9bd2ca;
        color: #0b5f58;
      }

      .view-toggle {
        display: inline-flex;
        gap: 4px;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .view-toggle button {
        width: 32px;
        height: 30px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: #596254;
      }

      .view-toggle button.is-active {
        background: var(--ink);
        color: #fff;
      }

      .view-toggle svg {
        width: 17px;
        height: 17px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .refresh-log {
        max-width: min(760px, 100%);
        margin-top: 8px;
        overflow-x: auto;
        scrollbar-width: thin;
      }

      .refresh-log[hidden] {
        display: none;
      }

      .refresh-log-strip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-width: max-content;
        padding-bottom: 2px;
      }

      .refresh-log-chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 26px;
        padding: 4px 8px;
        border: 1px solid #cfd8ca;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.82);
        color: #3f493d;
        font-size: 12px;
        line-height: 1;
        white-space: nowrap;
      }

      .refresh-log-chip.is-state {
        background: #14241f;
        border-color: #14241f;
        color: #fff;
      }

      .refresh-log-chip.is-group {
        background: #eef7f4;
        color: #0b5f58;
      }

      .refresh-log-k {
        opacity: 0.68;
        font-weight: 760;
      }

      .refresh-log-v {
        font-weight: 780;
      }

      .directory-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 240px));
        gap: 10px;
        margin-bottom: 12px;
      }

      .directory-card {
        position: relative;
        min-height: 96px;
        border: 0;
        border-radius: 8px;
        background: #151915;
        color: #fff;
        text-align: left;
        padding: 0;
        overflow: hidden;
        box-shadow: 0 4px 14px rgba(36, 72, 166, 0.10);
      }

      .directory-card::before {
        content: "";
        position: absolute;
        inset: 0 0 auto;
        height: 4px;
        background: var(--accent, var(--teal));
        z-index: 2;
      }

      .directory-card::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(16, 20, 16, 0.12), rgba(16, 20, 16, 0.78)),
          linear-gradient(90deg, rgba(16, 20, 16, 0.7), rgba(16, 20, 16, 0.08));
        z-index: 1;
      }

      .directory-card-image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scale(1.02);
        transition: transform 260ms ease;
      }

      .directory-card .image-status {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: #20251f;
        color: rgba(255, 255, 255, 0.86);
        font-size: 13px;
        font-weight: 760;
        text-align: center;
      }

      .directory-card.is-loading-private-preview .image-status,
      .directory-card.is-image-missing .image-status {
        display: flex;
      }

      .directory-card.is-loading-private-preview .directory-card-image,
      .directory-card.is-image-missing .directory-card-image {
        opacity: 0;
      }

      .directory-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 22px 50px rgba(25, 30, 24, 0.18);
      }

      .directory-card:hover .directory-card-image {
        transform: scale(1.06);
      }

      .directory-card-content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        min-height: 96px;
        padding: 12px;
      }

      .directory-card h3 {
        margin: 0;
        font-size: 17px;
        line-height: 1.28;
      }

      .directory-card p {
        margin: 3px 0 0;
        color: rgba(255, 255, 255, 0.78);
        font-size: 13px;
      }

      .directory-card-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 7px;
        color: rgba(255, 255, 255, 0.88);
        font-size: 13px;
        font-weight: 720;
      }

      .directory-card-arrow {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.18);
        color: #fff;
        font-size: 18px;
        backdrop-filter: blur(14px);
      }

      .subcategory-strip {
        position: relative;
        margin: 0 0 16px;
      }

      .subcategory-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 12px;
      }

      .subcategory-heading h3 {
        margin: 0;
        font-size: 18px;
      }

      .subcategory-heading p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .subcategory-tabs {
        display: flex;
        flex-wrap: nowrap;
        gap: 8px;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 2px 2px 10px;
        margin: 0 -2px;
        scroll-snap-type: x proximity;
        scrollbar-width: thin;
        -webkit-overflow-scrolling: touch;
      }

      .subcategory-tabs::after {
        content: "";
        flex: 0 0 8px;
      }

      .subcategory-tab {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 34px;
        border: 1px solid #d7ded3;
        border-radius: 999px;
        background: #fff;
        color: #3f483d;
        padding: 7px 12px;
        font-size: 13px;
        font-weight: 720;
        white-space: nowrap;
        scroll-snap-align: start;
      }

      .subcategory-tab:hover,
      .subcategory-tab.is-active {
        border-color: #0f766e;
        background: #dff2ef;
        color: #075a53;
      }

      .subcategory-count {
        color: currentColor;
        opacity: 0.72;
        font-size: 12px;
      }

      .masonry {
        column-width: 236px;
        column-gap: 16px;
      }

      .masonry.is-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(196px, 1fr));
        gap: 12px;
        column-width: auto;
      }

      .asset-card {
        position: relative;
        display: inline-block;
        width: 100%;
        margin: 0 0 16px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: 0 8px 24px rgba(25, 30, 24, 0.07);
        break-inside: avoid;
        content-visibility: auto;
        contain-intrinsic-size: 320px 420px;
      }

      .gallery-more { display: block; margin: 16px auto 0; padding: 8px 20px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font-size: 13px; }
      .source-link { display: inline-block; margin-top: 12px; color: var(--teal); font-size: 13px; }

      .masonry.is-grid .asset-card {
        display: block;
        margin: 0;
      }

      .asset-media {
        position: relative;
        width: 100%;
        aspect-ratio: 4 / 5;
        overflow: hidden;
        background: #d8ddd4;
      }

      .asset-media::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(180deg, rgba(12, 18, 15, 0.18), transparent 32%),
          linear-gradient(0deg, rgba(12, 18, 15, 0.16), transparent 40%);
        opacity: 0.92;
      }

      .asset-media > button[data-open] {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        padding: 0;
        background: transparent;
      }

      .asset-media img {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 150px;
        object-fit: cover;
        background: #e4e8e0;
      }

      .image-status {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: none;
        place-items: center;
        min-height: 150px;
        padding: 18px;
        background: #e4e8e0;
        color: #384138;
        font-size: 13px;
        font-weight: 760;
        line-height: 1.45;
        text-align: center;
      }

      .asset-media.is-loading-private-preview .image-status,
      .asset-media.is-image-missing .image-status {
        display: grid;
      }

      .asset-media.is-loading-private-preview img,
      .asset-media.is-image-missing img {
        opacity: 0;
      }

      .asset-type {
        position: absolute;
        left: 10px;
        bottom: 12px;
        z-index: 2;
        display: inline-flex;
        align-items: center;
        min-height: 26px;
        max-width: calc(100% - 20px);
        padding: 5px 8px;
        border-radius: 999px;
        background: rgba(18, 20, 17, 0.74);
        color: #fff;
        font-size: 12px;
        font-weight: 720;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .card-actions {
        position: absolute;
        top: 12px;
        right: 12px;
        display: flex;
        gap: 8px;
        opacity: 0;
        transform: translateY(-4px);
        z-index: 2;
        transition:
          opacity 160ms ease,
          transform 160ms ease;
      }

      .asset-card:hover .card-actions,
      .asset-card:focus-within .card-actions {
        opacity: 1;
        transform: translateY(0);
      }

      .card-action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-width: 54px;
        height: 38px;
        padding: 0 10px;
        border: 1px solid rgba(255, 255, 255, 0.82);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.94);
        color: #242824;
        cursor: pointer;
        font: inherit;
        text-decoration: none;
        box-shadow:
          0 10px 24px rgba(9, 13, 10, 0.22),
          inset 0 1px 0 rgba(255, 255, 255, 0.86);
        backdrop-filter: blur(14px);
        transition:
          transform 150ms ease,
          box-shadow 150ms ease,
          background 150ms ease,
          color 150ms ease;
      }

      .card-action:hover {
        transform: translateY(-1px);
        box-shadow:
          0 14px 30px rgba(9, 13, 10, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }

      .card-action[data-favorite] {
        color: #b22641;
      }

      .card-action[data-download] {
        color: #0f766e;
      }

      .card-action.is-favorite {
        background: #c2415d;
        color: #fff;
      }

      .card-action.is-favorite svg {
        fill: currentColor;
      }

      .card-action svg {
        width: 18px;
        height: 18px;
        stroke-width: 2.35;
      }

      .card-action span {
        font-size: 13px;
        line-height: 1;
        white-space: nowrap;
        color: currentColor;
        font-weight: 780;
      }

      .card-body {
        padding: 11px 12px 12px;
      }

      .asset-title {
        margin: 0 0 8px;
        font-size: 14px;
        line-height: 1.38;
        font-weight: 760;
      }

      .asset-meta {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        align-items: center;
        color: var(--muted);
        font-size: 12px;
      }

      .asset-maker {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .assignee-control {
        display: grid;
        gap: 6px;
        margin-top: 10px;
      }

      .assignee-control label {
        color: var(--muted);
        font-size: 11px;
        font-weight: 760;
      }

      .assignee-control select {
        width: 100%;
        min-height: 34px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--text);
        font: inherit;
        font-size: 12px;
        font-weight: 680;
      }

      .assignee-control select:disabled {
        color: var(--muted);
        background: var(--surface-2);
      }

      .assignee-control.is-saving select {
        border-color: rgba(15, 118, 110, 0.45);
        background: #eef7f5;
      }

      .asset-stats {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .asset-stats span {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .asset-stats svg {
        width: 14px;
        height: 14px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .empty-state {
        display: none;
        place-items: center;
        min-height: 260px;
        border: 1px dashed #c6cec1;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.58);

      function normalizeApiError(message, fallback) {
        const text = String(message || fallback || "接口请求失败");
        if (/Worker exceeded resource limits|error\s*1102/i.test(text)) {
          return "图库服务触发 Cloudflare 资源限制（1102），请更新图库 Worker 后重试。";
        }
        if (/FUNCTION_INVOCATION_TIMEOUT|timed out|timeout|超时/i.test(text)) {
          return "请求超时：后台可能正在写入或刷新，请几秒后重试。刚提交领取的话，稍后刷新确认领取状态。";
        }
        return text;
      }

      async function apiPost(payload) {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const text = await response.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch (error) {
          const message = text.replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
          throw new Error(normalizeApiError(message.slice(0, 180), `接口请求失败 (${response.status})`));
        }
        if (!response.ok || !data.ok) {
          const error = new Error(normalizeApiError(data.error, `接口请求失败 (${response.status})`));
          error.status = response.status;
          throw error;
        }
        return data;
      }

      function withTimeout(promise, ms, label) {
        let timer = null;
        const timeout = new Promise((_, reject) => {
          timer = window.setTimeout(() => reject(new Error(`${label || "操作"}超时`)), ms);
        });
        return Promise.race([promise, timeout]).finally(() => {
          if (timer) window.clearTimeout(timer);
        });
      }

      function appendCacheBust(url) {
        const separator = url.includes("?") ? "&" : "?";
        return `${url}${separator}t=${encodeURIComponent(Date.now())}`;
      }

      function unwrapJsonCachePayload(data) {
        if (data && data.data && typeof data.data === "object") return data.data;
        if (data && data.snapshot && typeof data.snapshot === "object") return data.snapshot;
        return data;
      }

      function normalizeJsonCacheMeta(data, assetsCount) {
        const meta = Object.assign({}, data.cacheMeta || data.meta || {});
        if (!meta.cacheKey) {
          meta.cacheKey =
            data.cacheKey ||
            data.runId ||
            data.buildId ||
            data.updatedAt ||
            data.lastUpdated ||
            data.savedAt ||
            "";
        }
        if (!meta.buildId) meta.buildId = data.buildId || data.runId || meta.cacheKey || "";
        if (!meta.total) meta.total = Number(data.total || data.totalRows || assetsCount || 0);
        if (!meta.updatedAt) meta.updatedAt = data.updatedAt || data.lastUpdated || data.savedAt || "";
        meta.source = data.source || meta.source || "json-cache";
        return meta;
      }

      function normalizeJsonCacheSnapshot(data) {
        const payload = unwrapJsonCachePayload(data) || {};
        const rawAssets = Array.isArray(payload)
          ? payload
          : Array.isArray(payload.assets)
          ? payload.assets
          : Array.isArray(payload.items)
            ? payload.items
            : Array.isArray(payload.rows)
              ? payload.rows
              : [];
        const rawCatalogs = payload.catalogs || payload.catalog || [];
        const normalizedAssets = rawAssets.map(normalizeAsset).filter((asset) => asset.id);
        return {
          assets: normalizedAssets,
          catalog: Array.isArray(rawCatalogs) ? normalizeCatalogs(rawCatalogs) : [],
          assignees: normalizeAssignees(payload.assignees || payload.assignableUsers || []),
          cacheMeta: normalizeJsonCacheMeta(payload, normalizedAssets.length),
          source: payload.source || "json-cache",
          savedAt: payload.savedAt || payload.updatedAt || new Date().toISOString(),
          raw: payload,
        };
      }

      async function readSharedJsonCache() {
        if (!("caches" in window)) return null;
        const cache = await caches.open(SHARED_JSON_CACHE_NAME);
        const response = await cache.match(SHARED_JSON_CACHE_KEY);
        if (!response) return null;
        const cached = await response.json();
        return cached && cached.data ? cached.data : cached;
      }

      async function writeSharedJsonCache(data) {
        if (!("caches" in window)) return;
        const cache = await caches.open(SHARED_JSON_CACHE_NAME);
        await cache.put(
          SHARED_JSON_CACHE_KEY,
          new Response(JSON.stringify({ data, savedAt: new Date().toISOString() }), {
            headers: { "Content-Type": "application/json; charset=utf-8" },
          })
        );
      }

      async function fetchJsonCacheFromUrl() {
        if (!JSON_CACHE_URL) return null;
        const response = await fetch(appendCacheBust(JSON_CACHE_URL), {
          headers: { Accept: "application/json" },
          cache: "no-store",
        });
        const text = await response.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch (error) {
          throw new Error("JSON 缓存文件不是有效的 JSON");
        }
        if (!response.ok || data.ok === false) {
          throw new Error(data.error || `JSON 缓存下载失败 (${response.status})`);
        }
        return data;
      }

      async function fetchJsonCacheSnapshot(options = {}) {
        const force = Boolean(options.force);
        if (!force && jsonCacheSnapshot) return jsonCacheSnapshot;
        if (!force && jsonCacheSnapshotPromise) return jsonCacheSnapshotPromise;

        jsonCacheSnapshotPromise = (async () => {
          try {
            const data = await fetchJsonCacheFromUrl();
            if (data) {
              jsonCacheSnapshot = data;
              writeSharedJsonCache(data).catch((error) => console.warn("Unable to save shared JSON cache", error));
              return data;
            }
          } catch (error) {
            if (options.allowSharedFallback !== false) {
              const cached = await readSharedJsonCache().catch(() => null);
              if (cached) {
                jsonCacheSnapshot = cached;
                return cached;
              }
            }
            const token = getToken();
            if (token) {
              const data = await apiPost({ action: "jsonCache", token });
              jsonCacheSnapshot = data;
              writeSharedJsonCache(data).catch((cacheError) =>
                console.warn("Unable to save shared JSON cache", cacheError)
              );
              return data;
            }
            throw error;
          }
          return null;
        })();

        try {
          return await jsonCacheSnapshotPromise;
        } finally {
          jsonCacheSnapshotPromise = null;
        }
      }

      async function applyJsonCacheSnapshot(data, options = {}) {
        if (!data) return false;
        const snapshot = normalizeJsonCacheSnapshot(data);
        if (!snapshot.assets.length) return false;

        const unchanged = assetsLoaded && sameCacheMeta(assetCacheMeta, snapshot.cacheMeta);
        if (unchanged && options.onlyIfChanged) return false;

        setAssets(snapshot.assets);
        if (snapshot.catalog.length) catalog = snapshot.catalog;
        if (snapshot.assignees.length) assignees = snapshot.assignees;
        assetCacheMeta = snapshot.cacheMeta;
        assetsLoaded = true;
        await saveBrowserAssetCache();

        if (!options.background) {
          const sourceLabel = snapshot.source === "json-cache-proxy" ? "JSON 代理缓存" : "JSON 缓存文件";
          const suffix = unchanged ? "已是最新" : "已同步到共享缓存和本地缓存";
          els.resultText.textContent = `${getVisibleAssets().length} 个素材 · ${sourceLabel}${suffix}`;
        }

        renderNav();
        renderFilters();
        renderGalleryPreservingPosition();
        return true;
      }

      async function loadJsonAssetCache(options = {}) {
        if (!USE_JSON_CACHE) return false;
        const data = await fetchJsonCacheSnapshot({
          force: Boolean(options.force),
          allowSharedFallback: options.allowSharedFallback,
        });
        return applyJsonCacheSnapshot(data, options);
      }

      async function login(password) {
        const data = await apiPost({ action: "login", password });
        sessionStorage.setItem(TOKEN_KEY, data.token);
        return data.token;
      }

      function getToken() {
        return sessionStorage.getItem(TOKEN_KEY) || "";
      }

      function normalizeAsset(item) {
        const viewUrl = item.viewUrl || item.previewUrl || "";
        const downloadUrl = item.downloadUrl || toDriveDownloadUrl(viewUrl || item.previewUrl || item.image || "");
        const fileId =
          item.fileId ||
          extractDriveId(item.sourceUrl || "") ||
          extractDriveId(viewUrl) ||
          extractDriveId(downloadUrl) ||
          extractDriveId(item.previewUrl || item.image || "") ||
          (looksLikeDriveFileId(item.id) ? item.id : "");
        return {
          mediaType: item.mediaType || "image",
          videoUrl: item.videoUrl || viewUrl,
          releaseDate: item.releaseDate || "",
          id: item.id,
          catalogId: item.catalogId || inferCatalogId(item),
          date: item.date || "",
          group: item.group || "",
          type: item.type || "",
          maker: item.maker || "",
          title: item.title || item.type || "未命名素材",
          image: item.previewUrl || item.image || (item.mediaType === "video" ? "" : item.viewUrl) || "",
          previewUrl: item.previewUrl || item.image || "",
          viewUrl,
          downloadUrl,
          fileId,
          favorites: Number(item.favorites || 0),
          downloads: Number(item.downloads || 0),
          assignee: item.assignee || "",
          assignedAt: item.assignedAt || "",
        };
      }

      function normalizeCatalogs(items) {
        return (items || []).map((item) => ({
          id: item.id,
          name: item.title || item.name,
          children: item.children || [],
        }));
      }

      function normalizeAssignees(items) {
        return [...new Set((items || []).map((item) => String(item || "").trim()).filter(Boolean))];
      }

      function invalidateAssetCaches() {
        visibleAssetsCache = null;
        visibleAssetsByCatalogCache = null;
        visibleAssetsByTypeCache = null;
      }

      function setAssets(nextAssets) {
        assets = Array.isArray(nextAssets) ? nextAssets : [];
        assetById = new Map(assets.map((asset) => [asset.id, asset]));
        invalidateAssetCaches();
      }

      function openAssetDb() {
        if (!("indexedDB" in window)) return Promise.resolve(null);
        return new Promise((resolve, reject) => {
          let settled = false;
          const timer = window.setTimeout(() => { settled = true; resolve(null); }, 2500);
          const request = window.indexedDB.open(ASSET_DB_NAME, 1);
          request.onupgradeneeded = () => {
            if (!request.result.objectStoreNames.contains(ASSET_STORE_NAME)) request.result.createObjectStore(ASSET_STORE_NAME, { keyPath: "key" });
          };
          request.onsuccess = () => {
            window.clearTimeout(timer);
            if (settled) request.result.close();
            else { settled = true; resolve(request.result); }
          };
          request.onerror = request.onblocked = () => {
            window.clearTimeout(timer);
            if (!settled) { settled = true; reject(request.error || new Error("本地缓存暂不可用")); }
          };
        });
      }

      async function readBrowserAssetCache() {
        const db = await openAssetDb();
        if (!db) return null;
        return new Promise((resolve, reject) => {
          const tx = db.transaction(ASSET_STORE_NAME, "readonly");
          const request = tx.objectStore(ASSET_STORE_NAME).get(ASSET_CACHE_KEY);
          request.onsuccess = () => resolve(request.result ? request.result.value : null);
          request.onerror = () => { db.close(); reject(request.error); };
          tx.onabort = () => { db.close(); reject(tx.error); };
          tx.oncomplete = () => db.close();
        });
      }

      async function writeBrowserAssetCache(payload) {
        const db = await openAssetDb();
        if (!db) return;
        return new Promise((resolve, reject) => {
          const tx = db.transaction(ASSET_STORE_NAME, "readwrite");
          tx.objectStore(ASSET_STORE_NAME).put({ key: ASSET_CACHE_KEY, value: payload });
          tx.oncomplete = () => {
            db.close();
            resolve();
          };
          tx.onerror = tx.onabort = () => { db.close(); reject(tx.error); };
        });
      }

      async function clearBrowserAssetCache() {
        browserCacheGeneration += 1;
        try {
          await browserCacheWrite.catch(() => {});
          const db = await openAssetDb();
          if (!db) return;
          await new Promise((resolve, reject) => {
            const tx = db.transaction(ASSET_STORE_NAME, "readwrite");
            tx.objectStore(ASSET_STORE_NAME).clear();
            tx.oncomplete = () => { db.close(); resolve(); };
            tx.onerror = tx.onabort = () => { db.close(); reject(tx.error); };
          });
        } catch (error) { console.warn("Unable to clear browser asset cache", error); }
      }

      function resetLoadedGallery() {
        galleryLoadGeneration += 1; assetsLoading = false;
        setAssets([]); catalog = []; assignees = []; assetsLoaded = false; assetCacheMeta = null;
        assetsLoadPromise = null; galleryRenderToken += 1;
        if (galleryObserver) galleryObserver.disconnect();
        for (const element of [els.gallery, els.navList, els.homeView, els.subcategoryView, els.activePath]) element.innerHTML = "";
        els.galleryMoreBtn.hidden = true;
        previewOverrideById.clear(); previewBlockedIds.clear();
      }

      function isLoginError(error) {
        return error?.status === 401 || /未登录|登录|过期|失效|密码/.test(error?.message || "");
      }

      async function invalidateLogin() {
        sessionStorage.removeItem(TOKEN_KEY);
        resetLoadedGallery();
        showLogin();
        await clearBrowserAssetCache();
      }

      async function loadBrowserAssetCache() {
        const generation = galleryLoadGeneration, token = getToken();
        let snapshot;
        try { snapshot = await readBrowserAssetCache(); }
        catch (error) { console.warn("Browser asset cache unavailable", error); return false; }
        if (!snapshot) return false;
        if (snapshot.schema !== ASSET_CACHE_SCHEMA || !snapshot.complete || !Array.isArray(snapshot.assets) ||
            !snapshot.cacheMeta?.cacheKey || snapshot.assets.length !== Number(snapshot.cacheMeta.total) ||
            !Array.isArray(snapshot.catalog)) {
          await clearBrowserAssetCache(); return false;
        }
        // Authenticate and compare the server's current build + business date
        // BEFORE showing anything from disk. Never use an unvalidated offline copy.
        els.resultText.textContent = "正在校验本地缓存版本";
        const remoteMeta = await getRemoteCacheMeta();
        if (generation !== galleryLoadGeneration || token !== getToken()) return false;
        if (!sameCacheMeta(snapshot.cacheMeta, remoteMeta)) {
          await clearBrowserAssetCache(); return false;
        }
        setAssets(snapshot.assets.map(normalizeAsset));
        catalog = normalizeCatalogs(snapshot.catalog);
        assignees = normalizeAssignees(snapshot.assignees);
        assetCacheMeta = remoteMeta; assetsLoaded = true;
        renderNav(); renderFilters(); renderGalleryPreservingPosition();
        els.resultText.textContent = `${getVisibleAssets().length} 个素材 · 已使用本地缓存`;
        return true;
      }

      async function saveBrowserAssetCache() {
        if (!assetsLoaded || !assetCacheMeta?.cacheKey || assets.length !== Number(assetCacheMeta.total)) return false;
        const generation = browserCacheGeneration;
        const payload = {schema:ASSET_CACHE_SCHEMA,complete:true,cacheMeta:assetCacheMeta,
                         assets,catalog,assignees,savedAt:Date.now()};
        browserCacheWrite = browserCacheWrite.catch(() => {}).then(async () => {
          if (generation !== browserCacheGeneration) return false;
          try { await writeBrowserAssetCache(payload); return true; }
          catch (error) { console.warn("Unable to save browser asset cache", error); return false; }
        });
        return browserCacheWrite;
      }

      async function getRemoteCacheMeta() {
        const token = getToken();
        if (!token) return null;
        const data = await apiPost({ action: "cacheMeta", token });
        return data.cacheMeta || null;
      }

      function sameCacheMeta(a, b) {
        return Boolean(a?.cacheKey && a.cacheKey === b?.cacheKey && Number(a.total) === Number(b.total));
      }

      function formatNumber(value) {
        return Number(value || 0).toLocaleString("zh-CN");
      }

      function mergeAssets(nextItems) {
        if (!Array.isArray(nextItems) || !nextItems.length) return 0;
        const byId = new Map(assets.map((asset) => [asset.id, asset]));
        let changed = 0;
        nextItems.forEach((item) => {
          const asset = normalizeAsset(item);
          if (!asset.id) return;
          byId.set(asset.id, Object.assign({}, byId.get(asset.id), asset));
          changed += 1;
        });
        setAssets([...byId.values()]);
        assetsLoaded = true;
        return changed;
      }

      function applyStatsMap(stats) {
        if (!stats || typeof stats !== "object") return [];
        const changedAssets = [];
        assets.forEach((asset) => {
          const item = stats[asset.id];
          if (!item) return;
          const nextFavorites = Number(item.favorites || 0);
          const nextDownloads = Number(item.downloads || 0);
          const nextAssignee = item.assignee || "";
          const nextAssignedAt = item.assignedAt || "";
          if (
            Number(asset.favorites || 0) !== nextFavorites ||
            Number(asset.downloads || 0) !== nextDownloads ||
            (asset.assignee || "") !== nextAssignee ||
            (asset.assignedAt || "") !== nextAssignedAt
          ) {
            asset.favorites = nextFavorites;
            asset.downloads = nextDownloads;
            asset.assignee = nextAssignee;
            asset.assignedAt = nextAssignedAt;
            changedAssets.push(asset);
          }
        });
        return changedAssets;
      }

      async function syncRemoteStats(options = {}) {
        const token = getToken();
        if (!token || !assetsLoaded) return false;
        const data = await apiPost({ action: "stats", token });
        if (data.assignees) assignees = normalizeAssignees(data.assignees);
        const changedAssets = applyStatsMap(data.stats || {});
        if (changedAssets.length) {
          saveBrowserAssetCache().catch((error) => console.warn(error));
          if (!options.silent) els.resultText.textContent = `已同步 ${changedAssets.length} 条领取/统计记录`;
          if (state.statView === "favorites") {
            renderGalleryPreservingPosition();
          } else {
            changedAssets.forEach(syncAssetInlineViews);
          }
        }
        return Boolean(changedAssets.length);
      }

      async function loadRemoteData() {
        const token = getToken();
        if (!token) {
          showLogin();
          return;
        }

        els.resultText.textContent = "正在载入数据";
        els.emptyState.classList.remove("is-visible");
        resetLoadedGallery();
        const generation = galleryLoadGeneration;
        try {
          const hasBrowserCache = await loadBrowserAssetCache();
          if (generation !== galleryLoadGeneration) return;
          if (!hasBrowserCache) await loadAssetsPages({ force:true, background:false });
        } catch (error) {
          if (isLoginError(error) && token === getToken()) await invalidateLogin();
          throw error;
        }
        lastCacheCheck = Date.now();
        startCachePolling();
      }

      async function ensureAssetsLoaded() {
        if (assetsLoaded) return;
        if (assetsLoading) return assetsLoadPromise;
        if (assetsLoadPromise) return assetsLoadPromise;
        assetsLoadPromise = loadAssetsPages();
        return assetsLoadPromise;
      }

      async function loadAssetsPages(options = {}) {
        if (assetsLoading) return;
        const token = getToken();
        if (!token) {
          showLogin();
          return;
        }

        assetsLoading = true;
        const generation = galleryLoadGeneration;
        const background = Boolean(options.background);
        if (!background) els.resultText.textContent = "正在载入素材";
        els.emptyState.classList.remove("is-visible");
        try {
          const nextAssets = [];
          let nextCatalog = catalog;
          let nextMeta = null;
          let offset = 0;
          let cursor = "";
          let total = 0;
          let page = 0;
          while (true) {
            const payload = { action: "list", token, filters: {}, limit: PAGE_SIZE, offset, cursorMode: true };
            if (cursor) payload.cursor = cursor;
            const data = await apiPost(payload);
            if (generation !== galleryLoadGeneration || token !== getToken()) return;
            if (!data.cacheMeta?.cacheKey || (nextMeta && !sameCacheMeta(nextMeta, data.cacheMeta))) {
              const error = new Error("加载期间数据版本已变化，正在重新加载");
              error.snapshotChanged = true; throw error;
            }
            if (page === 0 && data.catalogs) {
              nextCatalog = normalizeCatalogs(data.catalogs);
            }
            if (data.assignees) assignees = normalizeAssignees(data.assignees);
            if (data.cacheMeta) nextMeta = data.cacheMeta;

            total = Number(data.total || 0);
            nextAssets.push(...(data.assets || []).map(normalizeAsset));
            if (page === 0 || page % 10 === 0) {
              setAssets(nextAssets.slice());
              catalog = nextCatalog;
              renderNav(); renderFilters(); renderGalleryPreservingPosition();
            }

            if (!background) {
              els.resultText.textContent = total
                ? `正在载入素材 ${Math.min(nextAssets.length, total)} / ${total}`
                : `已显示 ${nextAssets.length} 个素材，后台继续同步`;
            }

            if (!data.hasMore || data.nextOffset === null || data.nextOffset === undefined) break;
            if (data.nextCursor) {
              cursor = data.nextCursor;
              offset = nextAssets.length;
            } else {
              offset = Number(data.nextOffset);
            }
            page += 1;
          }
          if (nextAssets.length !== Number(nextMeta.total)) {
            const error = new Error("素材列表未完整返回，请重新刷新");
            error.snapshotChanged = true; throw error;
          }
          setAssets(nextAssets);
          catalog = nextCatalog;
          assetCacheMeta = nextMeta;
          assetsLoaded = true;
          // A failed/blocked local database must not delay displaying a fresh list.
          saveBrowserAssetCache().catch(error => console.warn(error));
          if (!background) els.resultText.textContent = `${getVisibleAssets().length} 个素材 · 已加载全部素材`;
        } catch (error) {
          if (generation !== galleryLoadGeneration) return;
          assetsLoadPromise = null;
          const message = error && error.message ? error.message : String(error);
          if (isLoginError(error)) {
            await invalidateLogin();
            return;
          }
          if (error.snapshotChanged) {
            resetLoadedGallery(); await clearBrowserAssetCache();
            if (!options.snapshotRetry) {
              assetsLoading = false;
              return await loadAssetsPages({...options,snapshotRetry:true});
            }
            els.resultText.textContent = "素材载入中断";
            els.emptyState.textContent = "数据正在更新，请稍后点击刷新；未保存不完整缓存";
            els.emptyState.classList.add("is-visible");
            return;
          }
          if (background || assetsLoaded || assets.length) {
            const count = getVisibleAssets().length;
            if (!background) {
              els.resultText.textContent = count
                ? `已显示 ${count} 个素材 · 后台同步中断，稍后会重试`
                : "后台同步中断，稍后会重试";
            }
            els.emptyState.classList.remove("is-visible");
            console.warn(error);
            return;
          }
          els.resultText.textContent = "素材载入失败";
          els.emptyState.textContent = message.includes("FUNCTION_INVOCATION_TIMEOUT")
            ? "图库读取超时，请稍后重试。"
            : message;
          els.emptyState.classList.add("is-visible");
          console.error(error);
          return;
        } finally { if (generation === galleryLoadGeneration) assetsLoading = false; }

        renderNav();
        renderFilters();
        renderGalleryPreservingPosition();
      }

      async function checkForCacheUpdate(options = {}) {
        let remoteMeta;
        try { remoteMeta = await getRemoteCacheMeta(); }
        catch (error) {
          if (isLoginError(error)) await invalidateLogin();
          throw error;
        }
        if (!remoteMeta || sameCacheMeta(assetCacheMeta, remoteMeta)) return false;
        resetLoadedGallery(); await clearBrowserAssetCache();
        els.resultText.textContent = "发现新版本，正在更新素材";
        await loadAssetsPages({ force: true, background: Boolean(options.silent) });
        return true;
      }

      async function mergePendingAssets(status, options = {}) {
        return 0;
      }

      async function syncRunningRefresh() {
        const token = getToken();
        if (!token) return;

        const data = await apiPost({ action: "refreshStatus", token });
        const status = data.status || {};
        if (status.state === "running") {
          renderRefreshLog(status);
        }
      }

      function startCachePolling() {
        if (cachePollTimer) clearInterval(cachePollTimer);
        cachePollTimer = setInterval(checkVisibleCache, 300000);
      }

      async function checkVisibleCache() {
        if (!getToken() || document.hidden || cacheCheckInFlight || Date.now()-lastCacheCheck<300000) return;
        cacheCheckInFlight = true; lastCacheCheck = Date.now();
        try { await checkForCacheUpdate({silent:true}); }
        catch(error) { console.warn(error); }
        finally { cacheCheckInFlight = false; }
      }

      function loadState() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
          if (Array.isArray(saved.favorites)) {
            state.favorites = new Set(saved.favorites);
          }
        } catch (error) {
          console.warn("Unable to load local state", error);
        }
      }

      function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ favorites: [...state.favorites] }));
      }

      function uniqueValues(key, list = getVisibleAssets()) {
        return [...new Set(list.map((item) => item[key]).filter(Boolean))].sort((a, b) => a.localeCompare(b, "zh-CN"));
      }

      function getVisibleAssets() {
        if (!visibleAssetsCache) visibleAssetsCache = assets.filter(isAssetReleased);
        return visibleAssetsCache;
      }

      function getVisibleAssetsByCatalog() {
        if (visibleAssetsByCatalogCache) return visibleAssetsByCatalogCache;
        const map = new Map();
        getVisibleAssets().forEach((asset) => {
          const catalogId = asset.catalogId || inferCatalogId(asset);
          if (!map.has(catalogId)) map.set(catalogId, []);
          map.get(catalogId).push(asset);
        });
        visibleAssetsByCatalogCache = map;
        return map;
      }

      function getVisibleAssetsByType() {
        if (visibleAssetsByTypeCache) return visibleAssetsByTypeCache;
        const map = new Map();
        getVisibleAssets().forEach((asset) => {
          if (!map.has(asset.type)) map.set(asset.type, []);
          map.get(asset.type).push(asset);
        });
        visibleAssetsByTypeCache = map;
        return map;
      }

      function isAssetReleased(asset) {
        // The Pages API withholds unreleased data according to the software's timezone and rules.
        return true;
      }

      function getCurrentGroup() {
        return state.group || state.activeGroup;
      }

      function getCurrentType() {
        return state.type || state.activeType;
      }

      function getCatalogIdByName(name) {
        const item = catalog.find((entry) => entry.name === name);
        return item ? item.id : "";
      }

      function inferCatalogId(asset) {
        const id = String(asset.id || "");
        const type = String(asset.type || "");
        if (id.startsWith("fb_images:") || type.startsWith("FB-")) return "fb_images";
        if (id.startsWith("wsp_images:") || type.startsWith("示例分类3-")) return "wsp_images";
        if (id.startsWith("douyin_effects:") || type === "抖音效果类") return "douyin_effects";
        if (id.startsWith("sp_videos:") || type.startsWith("SP-")) return "sp_videos";
        return "";
      }

      function extractDriveId(url) {
        const text = String(url || "");
        const patterns = [/\/file\/d\/([^/]+)/, /[?&]id=([^&]+)/, /\/d\/([^/]+)/];
        for (const pattern of patterns) {
          const match = text.match(pattern);
          if (match) return decodeURIComponent(match[1]);
        }
        return "";
      }

      function looksLikeDriveFileId(value) {
        const text = String(value || "");
        return !text.includes(":") && /^[A-Za-z0-9_-]{20,}$/.test(text);
      }

      function getAssetById(assetId) {
        return assetById.get(assetId) || assets.find((item) => item.id === assetId);
      }

      function getAssetFileId(asset) {
        if (!asset) return "";
        return (
          asset.fileId ||
          extractDriveId(asset.viewUrl) ||
          extractDriveId(asset.downloadUrl) ||
          extractDriveId(asset.previewUrl) ||
          extractDriveId(asset.image) ||
          (looksLikeDriveFileId(asset.id) ? asset.id : "")
        );
      }

      function toDriveDownloadUrl(url) {
        let id = "", key = "";
        try {
          const parsed = new URL(url);
          if (!['drive.google.com','docs.google.com','drive.usercontent.google.com'].includes(parsed.hostname)) return "";
          id = extractDriveId(url);
          key = parsed.searchParams.get("resourcekey") || parsed.searchParams.get("resourceKey") || "";
        } catch { return ""; }
        if (!id) return "";
        return `https://drive.google.com/uc?export=download&id=${encodeURIComponent(id)}` + (key ? `&resourcekey=${encodeURIComponent(key)}` : "");
      }

      function toDriveThumbnailUrlFromId(id) {
        return id ? `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w1000` : "";
      }

      function toDriveLh3UrlFromId(id) {
        return id ? `https://lh3.googleusercontent.com/d/${encodeURIComponent(id)}=w1000` : "";
      }

      function toDriveViewImageUrlFromId(id) {
        return id ? `https://drive.google.com/uc?export=view&id=${encodeURIComponent(id)}` : "";
      }

      function getAssetDownloadHref(asset) {
        if (!asset) return "";
        // Old published snapshots stored /view here; normalize them without a re-upload.
        return toDriveDownloadUrl(asset.downloadUrl || asset.viewUrl) || asset.downloadUrl || (isExternalUrl(asset.viewUrl) ? asset.viewUrl : "");
      }

      function isExternalUrl(url) {
        return /^https?:\/\//i.test(String(url || ""));
      }

      function uniqueUrls(urls) {
        const seen = new Set();
        return urls.filter((url) => {
          const value = String(url || "").trim();
          if (!value || seen.has(value)) return false;
          seen.add(value);
          return true;
        });
      }

      function getAssetImageSrc(asset) {
        if (previewBlockedIds.has(asset.id)) return PREVIEW_PLACEHOLDER;
        return previewOverrideById.get(asset.id) || getPreviewCandidates(asset)[0] || PREVIEW_PLACEHOLDER;
      }

      function getPreviewCandidates(asset) {
        const fileId = getAssetFileId(asset);
        const candidates = [previewOverrideById.get(asset.id), asset.previewUrl, asset.image,
          fileId ? toDriveThumbnailUrlFromId(fileId) : "", fileId ? toDriveLh3UrlFromId(fileId) : ""];
        if (asset.mediaType !== "video" && !fileId) candidates.push(asset.viewUrl);
        // Drive's /view page is HTML, never a usable <img> source.
        return uniqueUrls(candidates).filter(isExternalUrl).filter(url => !/(?:drive|docs)\.google\.com\/file\/d\/[^/]+\/(?:view|preview)/.test(url));
      }

      function setPreviewState(img, className, label) {
        const shell = img.closest(".asset-media") || img.closest(".directory-card");
        if (!shell) return;
        shell.classList.remove("is-loading-private-preview", "is-image-missing");
        if (className) shell.classList.add(className);
        const status = shell.querySelector(".image-status");
        if (status && label) status.textContent = label;
      }

      function setImageSource(img, src, step) {
        img.dataset.previewIndex = String(step);
        img.src = src;
      }

      function applyPreviewOverride(assetId, src) {
        if (!assetId || !src) return;
        previewOverrideById.set(assetId, src);
        document.querySelectorAll("[data-asset-img]").forEach((img) => {
          if (img.dataset.assetImg !== assetId) return;
          img.dataset.privatePreviewStage = src.startsWith("data:") ? "done" : "url";
          if (src.startsWith("data:")) img.dataset.privatePreviewDataTried = "1";
          setPreviewState(img, "", "");
          setImageSource(img, src, "private");
        });
        if (els.lightboxImg.dataset.assetImg === assetId) {
          els.lightboxImg.dataset.privatePreviewStage = src.startsWith("data:") ? "done" : "url";
          if (src.startsWith("data:")) els.lightboxImg.dataset.privatePreviewDataTried = "1";
          setPreviewState(els.lightboxImg, "", "");
          setImageSource(els.lightboxImg, src, "private");
        }
      }

      function schedulePreviewUrlQueue() {
        if (previewUrlQueueTimer) return;
        previewUrlQueueTimer = window.setTimeout(flushPreviewUrlQueue, 120);
      }

      function requestPrivatePreviewUrl(asset) {
        return Promise.reject(new Error("私有预览已关闭"));
      }

      async function flushPreviewUrlQueue() {
        previewUrlQueueTimer = null;
        const batch = Array.from(previewUrlQueue.values()).slice(0, 12);
        batch.forEach((item) => previewUrlQueue.delete(item.asset.id));
        if (!batch.length) return;
        batch.forEach((item) => item.reject(new Error("私有预览已关闭")));
        if (previewUrlQueue.size) schedulePreviewUrlQueue();
      }

      function requestPrivatePreviewData(asset) {
        return Promise.reject(new Error("私有预览已关闭"));
      }

      async function handleImageError(event) {
        const img = event.target;
        if (!img || img.tagName !== "IMG" || !img.dataset.assetImg) return;

        const asset = getAssetById(img.dataset.assetImg);
        if (!asset) return;

        const candidates = getPreviewCandidates(asset);
        const currentIndex = Number.parseInt(img.dataset.previewIndex || "0", 10);
        const nextIndex = Number.isFinite(currentIndex) ? currentIndex + 1 : 1;
        if (nextIndex < candidates.length) {
          setImageSource(img, candidates[nextIndex], nextIndex);
          return;
        }

        previewBlockedIds.add(asset.id);
        img.src = PREVIEW_PLACEHOLDER;
        setPreviewState(img, "is-image-missing", "暂无缩略图 · 点击打开素材");
      }

      function handleImageLoad(event) {
        const img = event.target;
        if (!img || img.tagName !== "IMG" || !img.dataset.assetImg) return;
        if (img.src === PREVIEW_PLACEHOLDER) {
          setPreviewState(img, "is-image-missing", "暂无缩略图 · 点击打开素材");
          return;
        }
        previewBlockedIds.delete(img.dataset.assetImg);
        previewOverrideById.set(img.dataset.assetImg, img.src);
        setPreviewState(img, "", "");
      }

      function hasGlobalFilters() {
        return Boolean(state.query || state.maker || state.startDate || state.endDate || state.group || state.type || state.statView);
      }

      function isHomeMode() {
        return !getCurrentGroup() && !getCurrentType() && !hasGlobalFilters();
      }

      function getGroupAssets(groupName) {
        const catalogId = getCatalogIdByName(groupName);
        const fromCatalog = getVisibleAssetsByCatalog().get(catalogId) || [];
        if (fromCatalog.length) return fromCatalog;
        return getVisibleAssets().filter((asset) => asset.group === groupName);
      }

      function getTypeAssets(typeName) {
        return getVisibleAssetsByType().get(typeName) || [];
      }

      function getAccent(index) {
        return ["#0f766e", "#c2415d", "#b57913"][index % 3];
      }

      function fillSelect(select, values, firstLabel) {
        select.innerHTML = [`<option value="">${firstLabel}</option>`, ...values.map((value) => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`)].join("");
      }

      function formatDate(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function addDays(date, days) {
        const next = new Date(date);
        next.setDate(next.getDate() + days);
        return next;
      }

      function setDateRange(startDate, endDate, preset) {
        state.startDate = startDate;
        state.endDate = endDate;
        state.datePreset = preset;
        els.startDateInput.value = startDate;
        els.endDateInput.value = endDate;
        syncRangeSelect();
        renderGallery();
      }

      function syncRangeSelect() {
        els.quickRangeSelect.value = state.datePreset;
      }

      function getDateLabel() {
        if (state.datePreset === "today") return "今天";
        if (state.datePreset === "yesterday") return "昨天";
        if (state.datePreset === "last7") return "近7天";
        if (state.startDate && state.endDate) return `${state.startDate} 至 ${state.endDate}`;
        if (state.startDate) return `${state.startDate} 起`;
        if (state.endDate) return `${state.endDate} 止`;
        return "";
      }

      function getDateSortLabel() {
        if (state.dateSort === "desc") return "日期新到旧";
        if (state.dateSort === "asc") return "日期旧到新";
        return "";
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function renderNav() {
        els.navList.innerHTML = catalog
          .map((group) => {
            const children = group.children
              .map(
                (child) => `
                  <li>
                    <button class="nav-child" data-group="${escapeHtml(group.name)}" data-type="${escapeHtml(child)}">
                      ${escapeHtml(child)}
                    </button>
                  </li>
                `,
              )
              .join("");
            return `
              <li class="nav-group">
                <button class="nav-parent" data-group="${escapeHtml(group.name)}">
                  <span class="nav-parent-main"><span class="dot"></span><span>${escapeHtml(group.name)}</span></span>
                  <span class="nav-chevron">›</span>
                </button>
                <ul class="sub-list">${children}</ul>
              </li>
            `;
          })
          .join("");
      }

      function renderFilters() {
        fillSelect(els.groupSelect, uniqueValues("group"), "全部组别");
        fillSelect(els.typeSelect, uniqueValues("type"), "全部类别");
        fillSelect(els.makerSelect, uniqueValues("maker"), "全部制作人");
        els.makerSelect.value = state.maker;
      }

      function renderHomeView() {
        els.homeView.innerHTML = catalog
          .map((group, index) => {
            const groupAssets = getGroupAssets(group.name);
            const cover = groupAssets[index % Math.max(groupAssets.length, 1)] || groupAssets[0];
            const coverSrc = cover ? getAssetImageSrc(cover) : "";
            return `
              <button class="directory-card" type="button" data-home-group="${escapeHtml(group.name)}" style="--accent:${getAccent(index)}">
                ${
                  cover
                    ? `<img class="directory-card-image" src="${escapeHtml(coverSrc)}" alt="" loading="lazy" referrerpolicy="no-referrer" data-asset-img="${escapeHtml(cover.id)}" data-preview-index="0" /><span class="image-status">无预览权限</span>`
                    : ""
                }
                <div class="directory-card-content">
                  <h3>${escapeHtml(group.name)}</h3>
                  <p>${group.children.length} 个二级目录</p>
                  <div class="directory-card-footer">
                    <span>${groupAssets.length} 个素材</span>
                    <span class="directory-card-arrow">›</span>
                  </div>
                </div>
              </button>
            `;
          })
          .join("");
      }

      function renderSubcategoryView() {
        const groupName = getCurrentGroup();
        const currentType = getCurrentType();
        const group = catalog.find((item) => item.name === groupName);
        if (!group) {
          els.subcategoryView.hidden = true;
          els.subcategoryView.innerHTML = "";
          return;
        }

        const groupAssets = getGroupAssets(group.name);
        const tabs = group.children
          .map((child) => {
            const typeAssets = groupAssets.filter(asset => asset.type === child);
            return `
              <button class="subcategory-tab ${currentType === child ? "is-active" : ""}" type="button" data-subcategory="${escapeHtml(child)}" data-group="${escapeHtml(group.name)}">
                <span>${escapeHtml(child)}</span>
                <span class="subcategory-count">${typeAssets.length}</span>
              </button>
            `;
          })
          .join("");

        els.subcategoryView.hidden = false;
        els.subcategoryView.innerHTML = `
          <div class="subcategory-heading">
            <div>
              <h3>${escapeHtml(group.name)}</h3>
              <p>${group.children.length} 个二级目录 · ${groupAssets.length} 个素材</p>
            </div>
          </div>
          <div class="subcategory-tabs">
            <button class="subcategory-tab ${currentType ? "" : "is-active"}" type="button" data-subcategory="" data-group="${escapeHtml(group.name)}">
              <span>全部</span>
              <span class="subcategory-count">${groupAssets.length}</span>
            </button>
            ${tabs}
          </div>
        `;
      }

      function getFilteredAssets() {
        const query = state.query.trim().toLowerCase();
        const activeCatalogId = state.activeGroup ? getCatalogIdByName(state.activeGroup) : "";
        const filtered = getVisibleAssets().filter((asset) => {
          const matchesGroup = state.group
            ? asset.group === state.group
            : !state.activeGroup || asset.catalogId === activeCatalogId || asset.group === state.activeGroup;
          const matchesType = !state.type && !state.activeType ? true : asset.type === (state.type || state.activeType);
          const matchesMaker = !state.maker || asset.maker === state.maker;
          const matchesAssigneeStatus =
            !state.assigneeStatus ||
            (state.assigneeStatus === "assigned" && isAssignableAsset(asset) && Boolean(asset.assignee)) ||
            (state.assigneeStatus === "unassigned" && isAssignableAsset(asset) && !asset.assignee);
          const matchesStartDate = !state.startDate || asset.date >= state.startDate;
          const matchesEndDate = !state.endDate || asset.date <= state.endDate;
          const matchesStat =
            !state.statView ||
            (state.statView === "favorites" && getFavoriteCount(asset) > 0) ||
            (state.statView === "downloads" && getDownloadCount(asset) > 0);
          const haystack = `${asset.title} ${asset.group} ${asset.type} ${asset.maker}`.toLowerCase();
          const matchesQuery = !query || haystack.includes(query);
          return matchesGroup && matchesType && matchesMaker && matchesAssigneeStatus && matchesStartDate && matchesEndDate && matchesStat && matchesQuery;
        });
        return sortAssetsByDate(filtered);
      }

      function sortAssetsByDate(list) {
        if (!state.dateSort) return list;
        const direction = state.dateSort === "asc" ? 1 : -1;
        return list
          .map((asset, index) => ({ asset, index, time: parseAssetDateTime(asset.date) }))
          .sort((a, b) => {
            const aHasDate = Number.isFinite(a.time);
            const bHasDate = Number.isFinite(b.time);
            if (aHasDate && bHasDate && a.time !== b.time) return (a.time - b.time) * direction;
            if (aHasDate !== bHasDate) return aHasDate ? -1 : 1;
            return a.index - b.index;
          })
          .map((item) => item.asset);
      }

      function parseAssetDateTime(value) {
        if (!value) return NaN;
        const text = String(value).trim();
        const normalized = text.replace(/[年月./]/g, "-").replace(/日/g, "");
        let match = normalized.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
        if (match) return new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3])).getTime();

        match = normalized.match(/^(\d{1,2})-(\d{1,2})-(\d{4})/);
        if (match) {
          const first = Number(match[1]);
          const second = Number(match[2]);
          const year = Number(match[3]);
          const month = first > 12 ? second : first;
          const day = first > 12 ? first : second;
          return new Date(year, month - 1, day).getTime();
        }

        const fallback = new Date(text).getTime();
        return Number.isFinite(fallback) ? fallback : NaN;
      }

      function getDownloadCount(asset) {
        return Number(asset.downloads || 0);
      }

      function getFavoriteCount(asset) {
        return Number(asset.favorites || 0);
      }

      function isAssignableAsset(asset) {
        return Boolean(asset && ASSIGNABLE_CATALOG_IDS.has(asset.catalogId || inferCatalogId(asset)));
      }

      function assigneeOptionsHtml(current) {
        const options = [`<option value="">未领取</option>`];
        assignees.forEach((name) => {
          options.push(`<option value="${escapeHtml(name)}" ${name === current ? "selected" : ""}>${escapeHtml(name)}</option>`);
        });
        return options.join("");
      }

      function assigneeControlHtml(asset, context) {
        if (!isAssignableAsset(asset)) return "";
        const current = asset.assignee || "";
        const saving = asset.isAssigning ? "is-saving" : "";
        const disabled = assignees.length && !current && !asset.isAssigning ? "" : "disabled";
        const label = asset.isAssigning ? "正在保存领取人" : current ? `已领取：${current}` : "领取人";
        return `
          <div class="assignee-control ${saving}">
            <label>${escapeHtml(label)}</label>
            <select data-assignee="${escapeHtml(asset.id)}" data-assignee-context="${escapeHtml(context || "card")}" ${disabled}>
              ${assignees.length ? assigneeOptionsHtml(current) : `<option value="">暂无领取人名单</option>`}
            </select>
          </div>
        `;
      }

      function assetCardHtml(asset) {
        const isFavorite = state.favorites.has(asset.id);
        const downloadHref = getAssetDownloadHref(asset) || "#";
        const imageSrc = getAssetImageSrc(asset);
        return `
          <article class="asset-card" data-id="${escapeHtml(asset.id)}">
            <div class="asset-media">
              <button type="button" data-open="${escapeHtml(asset.id)}" aria-label="打开 ${escapeHtml(asset.title)}">
                <img src="${escapeHtml(imageSrc)}" alt="${escapeHtml(asset.title)}" loading="lazy" referrerpolicy="no-referrer" data-asset-img="${escapeHtml(asset.id)}" data-preview-index="0" />
                <span class="image-status">无预览权限</span>
              </button>
              <span class="asset-type">${escapeHtml(asset.type)}</span>
              <div class="card-actions">
                <button class="card-action ${isFavorite ? "is-favorite" : ""}" data-favorite="${escapeHtml(asset.id)}" title="本机收藏" aria-label="本机收藏">
                  ${icon("heart")}<span>${getFavoriteCount(asset)}</span>
                </button>
                <a class="card-action" href="${escapeHtml(downloadHref)}" target="assetDownloadFrame" download referrerpolicy="no-referrer" data-download="${escapeHtml(asset.id)}" title="下载" aria-label="下载">
                  ${icon("download")}<span>${getDownloadCount(asset)}</span>
                </a>
              </div>
            </div>
            <div class="card-body">
              <h3 class="asset-title">${escapeHtml(asset.title)}</h3>
              <div class="asset-meta">
                <span class="asset-maker">${escapeHtml(asset.date)} · ${escapeHtml(asset.maker)}</span>
              </div>
              ${assigneeControlHtml(asset, "card")}
            </div>
          </article>
        `;
      }

      function renderGalleryCards(list) {
        const token = ++galleryRenderToken;
        if (galleryObserver) galleryObserver.disconnect();
        const initialCount = Math.min(list.length, GALLERY_INITIAL_RENDER);
        els.gallery.innerHTML = list.slice(0, initialCount).map(assetCardHtml).join("");
        els.galleryMoreBtn.hidden = initialCount >= list.length;
        if (initialCount < list.length) {
          let position = initialCount;
          const loadMore = () => {
            if (token !== galleryRenderToken) return;
            if (galleryObserver) galleryObserver.unobserve(els.galleryMoreBtn);
            position = appendGalleryChunk(list, position, token);
            els.galleryMoreBtn.hidden = position >= list.length;
            if (galleryObserver && position < list.length) galleryObserver.observe(els.galleryMoreBtn);
          };
          els.galleryMoreBtn.onclick = loadMore;
          if (typeof IntersectionObserver === "function") {
            galleryObserver = new IntersectionObserver(entries => {
              if (entries.some(entry => entry.isIntersecting)) loadMore();
            }, {rootMargin:"1000px"});
            galleryObserver.observe(els.galleryMoreBtn);
          }
        }
      }

      function appendGalleryChunk(list, start, token) {
        if (token !== galleryRenderToken) return start;
        const end = Math.min(start + GALLERY_RENDER_CHUNK, list.length);
        els.gallery.insertAdjacentHTML("beforeend", list.slice(start, end).map(assetCardHtml).join(""));
        return end;
      }

      function renderGallery() {
        els.galleryMoreBtn.hidden = true;
        if (galleryObserver) galleryObserver.disconnect();
        const list = getFilteredAssets();
        const homeMode = isHomeMode();
        els.homeView.hidden = !homeMode;
        els.gallery.hidden = list.length === 0;
        els.emptyState.classList.toggle("is-visible", !homeMode && list.length === 0);

        if (homeMode) {
          renderHomeView();
          els.subcategoryView.hidden = true;
          els.subcategoryView.innerHTML = "";
          renderGalleryCards(list);
          els.resultText.textContent = assetsLoaded
            ? `${catalog.length} 个一级目录 · ${getVisibleAssets().length} 个素材`
            : `${catalog.length} 个一级目录`;
          renderActivePath(list);
          updateStats();
          syncNavState();
          return;
        }

        els.homeView.innerHTML = "";
        renderSubcategoryView();

        if (!assetsLoaded && !assets.length) {
          galleryRenderToken += 1;
          els.gallery.hidden = true;
          els.gallery.innerHTML = "";
          els.emptyState.classList.remove("is-visible");
          els.resultText.textContent = "正在载入素材";
          renderActivePath(list);
          updateStats();
          syncNavState();
          ensureAssetsLoaded().catch(showError);
          return;
        }

        const assigneeLabel =
          state.assigneeStatus === "assigned" ? " · 已领取" : state.assigneeStatus === "unassigned" ? " · 未领取" : "";
        els.resultText.textContent = `${list.length} 个素材 · ${uniqueValues("maker", list).length} 位制作人${assigneeLabel}`;
        renderGalleryCards(list);
        renderActivePath(list);
        updateStats();
        syncNavState();
      }

      function captureGalleryAnchor() {
        const cards = Array.from(els.gallery.querySelectorAll(".asset-card"));
        for (const card of cards) {
          const rect = card.getBoundingClientRect();
          if (rect.bottom > 80) return { id: card.dataset.id, top: rect.top };
        }
        return null;
      }

      function renderGalleryPreservingPosition() {
        const anchor = captureGalleryAnchor();
        renderGallery();
        if (!anchor || !anchor.id) return;
        window.requestAnimationFrame(() => {
          const card = els.gallery.querySelector(`.asset-card[data-id="${CSS.escape(anchor.id)}"]`);
          if (!card) return;
          const nextTop = card.getBoundingClientRect().top;
          window.scrollBy(0, nextTop - anchor.top);
        });
      }

      function renderActivePath(list) {
        if (isHomeMode()) {
          els.activePath.innerHTML = `<span class="chip strong">首页</span><span class="chip">${catalog.length} 个一级目录</span><span class="chip">${getVisibleAssets().length} 项</span>`;
          return;
        }
        const group = state.group || state.activeGroup || "全部组别";
        const type = state.type || state.activeType || "全部类别";
        const chips = [
          `<span class="chip strong">${escapeHtml(group)}</span>`,
          `<span class="chip">${escapeHtml(type)}</span>`,
        ];
        if (state.maker) chips.push(`<span class="chip">${escapeHtml(state.maker)}</span>`);
        if (state.assigneeStatus === "assigned") chips.push(`<span class="chip">已领取</span>`);
        if (state.assigneeStatus === "unassigned") chips.push(`<span class="chip">未领取</span>`);
        const dateLabel = getDateLabel();
        if (dateLabel) chips.push(`<span class="chip">${escapeHtml(dateLabel)}</span>`);
        const dateSortLabel = getDateSortLabel();
        if (dateSortLabel) chips.push(`<span class="chip">${escapeHtml(dateSortLabel)}</span>`);
        if (state.statView === "favorites") chips.push(`<span class="chip">有收藏的素材</span>`);
        if (state.statView === "downloads") chips.push(`<span class="chip">有下载的素材</span>`);
        chips.push(`<span class="chip">${list.length} 项</span>`);
        els.activePath.innerHTML = chips.join("");
      }

      function updateStats() {
        const visibleAssets = getVisibleAssets();
        const favoriteTotal = visibleAssets.reduce((sum, asset) => sum + getFavoriteCount(asset), 0);
        const downloadTotal = visibleAssets.reduce((sum, asset) => sum + getDownloadCount(asset), 0);
        els.favoriteSummary.textContent = `收藏 ${favoriteTotal}`;
        els.downloadSummary.textContent = `下载 ${downloadTotal}`;
        els.favoriteSummary.classList.toggle("is-active", state.statView === "favorites");
        els.downloadSummary.classList.toggle("is-active", state.statView === "downloads");
      }

      function toggleStatView(view) {
        state.statView = state.statView === view ? "" : view;
        renderGallery();
      }

      function syncAssetInlineViews(asset) {
        if (!asset) return;
        document.querySelectorAll(".asset-card").forEach((card) => {
          if (card.dataset.id !== asset.id) return;
          const favoriteButton = card.querySelector("[data-favorite]");
          const favoriteCount = favoriteButton && favoriteButton.querySelector("span");
          if (favoriteButton) favoriteButton.classList.toggle("is-favorite", state.favorites.has(asset.id));
          if (favoriteCount) favoriteCount.textContent = getFavoriteCount(asset);

          const downloadLink = card.querySelector("[data-download]");
          const downloadCount = downloadLink && downloadLink.querySelector("span");
          if (downloadLink) downloadLink.href = getAssetDownloadHref(asset) || "#";
          if (downloadCount) downloadCount.textContent = getDownloadCount(asset);
        });

        syncAssigneeViews(asset);
        updateStats();
      }

      function syncAssigneeViews(asset) {
        if (!asset) return;
        document.querySelectorAll("[data-assignee]").forEach((select) => {
          if (select.dataset.assignee !== asset.id) return;
