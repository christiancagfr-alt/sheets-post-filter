name: Build and publish release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows-release:
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Version
        id: meta
        shell: pwsh
        run: |
          $ref = $env:GITHUB_REF_NAME
          if ($ref -like "v*") { $version = $ref.TrimStart("v") }
          else { $version = python -c "from version import APP_VERSION; print(APP_VERSION)" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "version $version"

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements-build.txt

      - name: Run automated checks
        env:
          SHEETS_POST_FILTER_UI_TESTS: "1"
          SHEETS_POST_FILTER_DATA_DIR: ${{ runner.temp }}/sheets-post-filter-tests
        shell: pwsh
        run: |
          python tools/check_public_release.py
          python -m unittest discover -s tests -v
          node --check web/static/app.js
          node --test tests/legacy_security.test.mjs tests/summary_gallery.test.mjs tests/summary_frontend.test.mjs

      - name: Build Windows application
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean sheets_post_filter.spec

      - name: Verify built Windows startup
        shell: pwsh
        run: |
          python tools/check_frozen_startup.py "dist/数据汇总工具/数据汇总工具.exe"
          python tools/check_frozen_https.py "dist/数据汇总工具/数据汇总工具.exe"

      - name: Prepare release archive
        id: package
        shell: pwsh
        run: |
          $source = Join-Path $PWD "dist\数据汇总工具"
          $stage = Join-Path $PWD "release\data-summary-tool"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path (Join-Path $source "*") -Destination $stage -Recurse -Force
          Copy-Item config.example.json (Join-Path $stage "config.example.json") -Force
          Copy-Item 使用说明.txt (Join-Path $stage "使用说明.txt") -Force
          Copy-Item logo.ico (Join-Path $stage "logo.ico") -Force
          Copy-Item web/static/logo.png (Join-Path $stage "logo.png") -Force
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "web\static") | Out-Null
          Copy-Item web/static/logo.png (Join-Path $stage "web\static\logo.png") -Force
          Copy-Item uninstall-template.bat (Join-Path $stage "uninstall.bat") -Force
          $asset = "data-summary-tool-windows-v$env:VERSION.zip"
          $assetPath = Join-Path $PWD "release\$asset"
          Compress-Archive -Path $stage -DestinationPath $assetPath -CompressionLevel Optimal
          "asset=$asset" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "asset_path=$assetPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        id: installer
        shell: pwsh
        run: |
          if (-not (Test-Path installer-ChineseSimplified.isl)) { throw "Missing reviewed installer language file" }
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $compiler "/DMyAppVersion=$env:VERSION" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = "data-summary-tool-setup-v$env:VERSION.exe"
          $setupPath = Join-Path $PWD "release\$setup"
          if (-not (Test-Path -LiteralPath $setupPath)) { throw "Installer was not created: $setupPath" }
          "setup=$setup" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "setup_path=$setupPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Attest Windows assets
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            ${{ steps.package.outputs.asset_path }}
            ${{ steps.installer.outputs.setup_path }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: |
            release/data-summary-tool-windows-v${{ steps.meta.outputs.version }}.zip
            release/data-summary-tool-setup-v${{ steps.meta.outputs.version }}.exe

  macos-release:
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Ensure Tkinter
        run: |
          python -c "import tkinter" 2>/dev/null && echo "tkinter ok" && exit 0
          brew install python-tk@3.12
          echo "$(brew --prefix python@3.12)/bin" >> "$GITHUB_PATH"

      - name: Version
        id: meta
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(python -c 'from version import APP_VERSION; print(APP_VERSION)')"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version $VERSION arch ${{ matrix.arch }}"

      - name: Install dependencies
        run: |
          set -euo pipefail
          if [[ "${{ matrix.arch }}" == "x86_64" ]]; then
            # cryptography 50 has no Intel macOS wheel. Its source build must
            # not share a dylib basename with Python's older OpenSSL runtime.
            OPENSSL_STATIC=1 OPENSSL_DIR="$(brew --prefix openssl@3)" \
              python -m pip install --no-cache-dir --no-binary=cryptography -r requirements-build.txt
          else
            python -m pip install -r requirements-build.txt
          fi
          python tools/check_macos_crypto_linkage.py

      - name: Run automated checks
        env:
          SHEETS_POST_FILTER_UI_TESTS: "1"
          SHEETS_POST_FILTER_DATA_DIR: ${{ runner.temp }}/sheets-post-filter-tests
        run: |
          python tools/check_public_release.py
          python -m unittest discover -s tests -v
          node --check web/static/app.js
          node --test tests/legacy_security.test.mjs tests/summary_gallery.test.mjs tests/summary_frontend.test.mjs

      - name: Build macOS icns
        run: |
          set -euo pipefail
          SRC="web/static/logo.png"
          ICONSET="build/app.iconset"
          mkdir -p "$ICONSET"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" "$SRC" --out "$ICONSET/icon_${size}x${size}.png"
            sips -z "$((size * 2))" "$((size * 2))" "$SRC" --out "$ICONSET/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns "$ICONSET" -o logo.icns

      - name: Build macOS application
        run: python -m PyInstaller --noconfirm --clean sheets_post_filter.spec

      - name: Build and verify macOS DMG installation
        run: python tools/package_macos_dmg.py "dist/数据汇总工具.app" "release/data-summary-tool-macos-${{ matrix.arch }}-v${VERSION}.dmg"

      - name: Verify built macOS HTTPS certificate chain
        run: python tools/check_frozen_https.py "dist/数据汇总工具.app"

      - name: Package macOS zip
        run: |
          set -euo pipefail
          APP="dist/数据汇总工具.app"
          test -d "$APP"
          STAGE="release/macos"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          cp 使用说明.txt config.example.json "$STAGE/"
          ASSET="data-summary-tool-macos-${{ matrix.arch }}-v${VERSION}.zip"
          ditto -c -k --keepParent "$STAGE" "release/$ASSET"
          ls -lh "release/$ASSET"

      - name: Attest macOS asset
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            release/data-summary-tool-macos-${{ matrix.arch }}-v${{ steps.meta.outputs.version }}.zip
            release/data-summary-tool-macos-${{ matrix.arch }}-v${{ steps.meta.outputs.version }}.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            release/data-summary-tool-macos-${{ matrix.arch }}-v${{ steps.meta.outputs.version }}.zip
            release/data-summary-tool-macos-${{ matrix.arch }}-v${{ steps.meta.outputs.version }}.dmg

  publish-release:
    permissions:
      contents: write
    needs: [windows-release, macos-release]
    if: startsWith(github.ref, 'refs/tags/v') && needs.windows-release.result == 'success' && needs.macos-release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.windows-release.outputs.version }}
        run: |
          set -euo pipefail
          find artifacts -type f \( -name '*.zip' -o -name '*.exe' -o -name '*.dmg' \) -print
          mapfile -t FILES < <(find artifacts -type f \( -name '*.zip' -o -name '*.exe' -o -name '*.dmg' \))
          test "${#FILES[@]}" -eq 6
          TAG="v${VERSION}"
          NOTES="$(cat <<EOF
          数据汇总工具 ${TAG}

          - Windows 安装包：\`data-summary-tool-setup-v${VERSION}.exe\`
          - Windows 便携版：\`data-summary-tool-windows-v${VERSION}.zip\`
          - macOS Apple Silicon：\`data-summary-tool-macos-arm64-v${VERSION}.zip\`
          - macOS Intel：\`data-summary-tool-macos-x86_64-v${VERSION}.zip\`

          Mac：解压后把「数据汇总工具.app」拖到「应用程序」。若提示无法打开，按住 Control 点图标选打开。
          EOF
          )"
          if [[ -f "docs/release-v${VERSION}.md" ]]; then
            NOTES="$(cat "docs/release-v${VERSION}.md")"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "${FILES[@]}" --title "$TAG" --notes "$NOTES" --target "${GITHUB_SHA}"
          fi
